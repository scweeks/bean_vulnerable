name: Generate PlantUML Diagrams

on:
  push:
    branches: [main]
    paths:
      - 'docs/UML/Source/**/*.puml'
  workflow_dispatch:

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Graphviz tarball
        uses: actions/cache@v4
        with:
          path: .graphviz
          key: graphviz-2.42-${{ runner.os }}
          restore-keys: |
            graphviz-2.42-

      - name: Download Graphviz (if needed)
        run: |
          mkdir -p .graphviz
          if [ ! -f .graphviz/graphviz.tar.gz ]; then
            echo "Graphviz not found in cache — downloading"
            curl -L --fail --retry 3 -o .graphviz/graphviz.tar.gz \
              https://gitlab.com/graphviz/graphviz/-/archive/2.42.3/graphviz-2.42.3.tar.gz
            tar -xzf .graphviz/graphviz.tar.gz -C .graphviz
            sudo cp .graphviz/graphviz-2.42.3/bin/dot /usr/bin/
          else
            echo "Graphviz found in cache"
          fi
          dot -V

      - name: Cache PlantUML JAR
        uses: actions/cache@v4
        with:
          path: .plantuml/plantuml.jar
          key: plantuml-1.2026.3-${{ runner.os }}
          restore-keys: |
            plantuml-1.2026.3-

      - name: Download PlantUML JAR (if needed)
        run: |
          mkdir -p .plantuml
          if [ ! -f .plantuml/plantuml.jar ]; then
            echo "PlantUML JAR not found in cache — downloading"
            curl -L --fail --retry 3 -o .plantuml/plantuml.jar \
              https://github.com/plantuml/plantuml/releases/download/v1.2026.3/plantuml-gplv2-1.2026.3.jar
          else
            echo "PlantUML JAR found in cache"
          fi
          java -jar .plantuml/plantuml.jar -version

      - name: Define mapping function
        id: define-func
        run: |
          cat << 'EOF' > map_and_render.sh
          #!/usr/bin/env bash
          set -euo pipefail

          UML_TYPES=(Class Activity Sequence Package Component State UseCase Deployment Object Timing Gantt MindMap Other)

          detect_type() {
            local puml="$1"
            local rel="$2"
            local -n out_type=$3
            local -n out_index=$4

            IFS='/' read -r -a PARTS <<< "$rel"
            out_type=""
            out_index=-1

            # 1. Prefer type from path
            for idx in "${!PARTS[@]}"; do
              part="${PARTS[$idx]}"
              for t in "${UML_TYPES[@]}"; do
                if [[ "${part,,}" == "${t,,}" ]]; then
                  out_type="$t"
                  out_index=$idx
                  return
                fi
              done
            done

            # 2. Fallback to content
            local CONTENT
            CONTENT=$(sed -n '1,200p' "$puml" | tr '\n' ' ' | tr '[:upper:]' '[:lower:]')

            if   [[ "$CONTENT" == *"@startgantt"* ]]; then out_type="Gantt"
            elif [[ "$CONTENT" == *"@startmindmap"* ]]; then out_type="MindMap"
            elif echo "$CONTENT" | grep -Eq '\b(start|stop|partition|fork|merge|repeat)\b'; then out_type="Activity"
            elif echo "$CONTENT" | grep -Eq '\b(participant|activate|deactivate|->|<-|-->|<--)'; then out_type="Sequence"
            elif echo "$CONTENT" | grep -Eq '\b(class|interface|abstract|enum)\b'; then out_type="Class"
            elif echo "$CONTENT" | grep -Eq '\b(actor|usecase|\(.*\))\b'; then out_type="UseCase"
            elif echo "$CONTENT" | grep -Eq '\b(state\b|\[\*\])'; then out_type="State"
            elif echo "$CONTENT" | grep -Eq '\b(component|node|cloud|database)\b'; then out_type="Component"
            elif echo "$CONTENT" | grep -Eq '\bobject\b'; then out_type="Object"
            else out_type="Other"
            fi

            out_index=0
          }

          compute_outdir() {
            local rel="$1"
            local type="$2"
            local type_index="$3"
            local puml="$4"
            local -n out_dir=$5

            IFS='/' read -r -a PARTS <<< "$rel"

            # Module path = before type
            local MODULE_DIR=""
            if (( type_index > 0 )); then
              MODULE_DIR=$(printf "%s/" "${PARTS[@]:0:type_index}" | sed 's:/$::')
            fi

            # Remaining path after type (excluding filename)
            local REM_AFTER=()
            if (( type_index < ${#PARTS[@]} - 1 )); then
              REM_AFTER=("${PARTS[@]:$((type_index+1)):$(( ${#PARTS[@]} - type_index - 2 ))}")
            fi

            out_dir="docs/UML/$type"
            [[ -n "$MODULE_DIR" ]] && out_dir="$out_dir/$MODULE_DIR"

            if (( ${#REM_AFTER[@]} > 0 )); then
              local REM_DIR
              REM_DIR=$(printf "%s/" "${REM_AFTER[@]}" | sed 's:/$::')
              out_dir="$out_dir/$REM_DIR"
            fi

            # Append python filename folder unless it already contains the type
            local base
            base=$(basename "$puml" .puml)
            local lc_base="${base,,}"
            local lc_type="${type,,}"

            if [[ "$lc_base" != "$lc_type" && "$lc_base" != *"$lc_type"* ]]; then
              out_dir="$out_dir/$base"
            fi
          }

          process_file() {
            local puml="$1"
            local mode="$2" # dry or render

            REL="${puml#docs/UML/Source/}"

            detect_type "$puml" "$REL" TYPE TYPE_INDEX
            compute_outdir "$REL" "$TYPE" "$TYPE_INDEX" "$puml" OUT_DIR

            if [[ "$mode" == "dry" ]]; then
              echo "Source: $puml -> Output: $OUT_DIR (type: $TYPE)"
            else
              mkdir -p "$OUT_DIR"
              echo "Rendering: $puml -> $OUT_DIR"
              java -jar plantuml.jar -tsvg "$puml" -o "$OUT_DIR"
            fi
          }

          export -f detect_type compute_outdir process_file
          EOF

          chmod +x map_and_render.sh

      - name: Dry-run mapping
        run: |
          find docs/UML/Source -name "*.puml" | while read -r puml; do
            ./map_and_render.sh "$puml" dry
          done

      - name: Render diagrams
        run: |
          find docs/UML/Source -name "*.puml" | while read -r puml; do
            ./map_and_render.sh "$puml" render
          done

      - name: Debug - list generated files
        run: |
          echo "=== Generated output ==="
          find docs/UML -name "*.svg" | sort || echo "No SVGs found"

      - name: Commit generated diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/UML || true
          git diff --staged --quiet || git commit -m "ci: auto-generate UML diagrams [skip ci]"
          git push
