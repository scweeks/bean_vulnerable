name: Generate PlantUML Diagrams

on:
  push:
    branches: [main]
    paths:
      - 'docs/UML/Source/**/*.puml'
  workflow_dispatch:

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Download PlantUML JAR
        run: |
          curl -L --fail --retry 3 -o plantuml.jar \
            https://github.com/plantuml/plantuml/releases/download/v1.2026.3/plantuml-gplv2-1.2026.3.jar
          
          java -jar plantuml.jar -version

      - name: Generate SVGs with auto-routing
        run: |
          while IFS= read -r puml; do

            if grep -qiE "^\s*@startuml" "$puml"; then
              if grep -qiE "^\s*(class |abstract |interface |enum )" "$puml"; then
                TYPE="Class"
              elif grep -qiE "^\s*(\->|<\-|\".*\"\s*\->)" "$puml"; then
                TYPE="Sequence"
              elif grep -qiE "^\s*(actor |usecase |\(.*\))" "$puml"; then
                TYPE="UseCase"
              elif grep -qiE "^\s*(state |\[\*\])" "$puml"; then
                TYPE="State"
              elif grep -qiE "^\s*(component |node |cloud |database )" "$puml"; then
                TYPE="Component"
              elif grep -qiE "^\s*(object )" "$puml"; then
                TYPE="Object"
              elif grep -qiE "^\s*(concise |robust |clock )" "$puml"; then
                TYPE="Timing"
              elif grep -qiE "(@startgantt|@startmindmap)" "$puml"; then
                TYPE="Gantt"
              else
                TYPE="Other"
              fi
            else
              echo "Skipping $puml — no @startuml found"
              continue
            fi

            REL_PATH="${puml#docs/UML/Source/}"
            SUB_DIR=$(dirname "$REL_PATH")
            OUT_DIR="docs/UML/$TYPE/$SUB_DIR"
            mkdir -p "$OUT_DIR"

            TEMP_DIR=$(mktemp -d)
            echo "Processing: $puml -> $OUT_DIR [$TYPE]"
            java -jar plantuml.jar -tsvg "$puml" -o "$TEMP_DIR"
            mv "$TEMP_DIR"/*.svg "$OUT_DIR/" 2>/dev/null && \
              echo "  Moved to $OUT_DIR" || \
              echo "  WARNING: No SVGs generated for $puml"
            rm -rf "$TEMP_DIR"

          done < <(find docs/UML/Source -name "*.puml")

      - name: Debug - list generated files
        run: |
          echo "=== Generated output ==="
          find docs/UML -name "*.svg" | sort || echo "No SVGs found"
          echo "=== Source files ==="
          find docs/UML/Source -name "*.puml" | sort

      - name: Commit generated diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== Git status before add ==="
          git status

          echo "=== Adding all UML output ==="
          git add docs/UML/Class docs/UML/Sequence docs/UML/UseCase \
                  docs/UML/State docs/UML/Component docs/UML/Object \
                  docs/UML/Timing docs/UML/Gantt docs/UML/MindMap docs/UML/Other 2>/dev/null || true

          echo "=== Git status after add ==="
          git status

          echo "=== Staged files ==="
          git diff --staged --name-only

          git diff --staged --quiet || git commit -m "ci: auto-generate UML diagrams [skip ci]"
          git push