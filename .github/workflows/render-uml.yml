name: Render UML diagrams

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  render-uml:
    name: Render PlantUML -> SVG
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 0

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Download PlantUML JAR
      shell: bash
      run: |
        set -euo pipefail
        echo "Downloading PlantUML"
        curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

    - name: Render PlantUML diagrams
      shell: bash
      run: |
        set -euo pipefail
        echo "Rendering PlantUML diagrams from docs/UML/Source -> docs/UML/Class using plantuml.jar"
        mkdir -p docs/UML/Class
        if [ -d "docs/UML/Source" ]; then
          find docs/UML/Source -name '*.puml' -print0 | while IFS= read -r -d '' f; do
            rel="${f#docs/UML/Source/}"
            outdir="docs/UML/Class/$(dirname "$rel")"
            mkdir -p "$outdir"
            echo "Rendering $f -> $outdir"
            java -jar plantuml.jar -tsvg "$f" -o "$outdir"
          done
        else
          echo "No docs/UML/Source directory found; nothing to render."
        fi

    - name: Commit rendered diagrams
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/UML/Class || true
        if git diff --staged --quiet; then
          echo "No rendered changes to commit"
        else
          git commit -m "ci: Auto-render UML diagrams"
          git push
        fi
