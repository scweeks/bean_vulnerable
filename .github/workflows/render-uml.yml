name: Generate PlantUML Diagrams

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/UML/Source/**/*.puml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docs/UML/Source/**/*.puml'
  workflow_dispatch:

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          dot -V

      - name: Cache PlantUML JAR
        uses: actions/cache@v4
        with:
          path: .plantuml/plantuml.jar
          key: plantuml-1.2026.3-${{ runner.os }}
          restore-keys: |
            plantuml-1.2026.3-

      - name: Download PlantUML JAR (if needed)
        run: |
          mkdir -p .plantuml
          if [ ! -f .plantuml/plantuml.jar ]; then
            echo "PlantUML JAR not found in cache — downloading"
            curl -L --fail --retry 3 -o .plantuml/plantuml.jar \
              https://github.com/plantuml/plantuml/releases/download/v1.2026.3/plantuml-gplv2-1.2026.3.jar
          else
            echo "PlantUML JAR found in cache"
          fi
          java -jar .plantuml/plantuml.jar -version

      - name: Write render script
        run: |
          cat << 'SCRIPT' > map_and_render.sh
          #!/usr/bin/env bash
          set -euo pipefail

          # ── Type detection ───────────────────────────────────────────────────────────
          # Reads the first 200 lines of the .puml file and detects the diagram type
          # from content keywords. Returns one of the canonical type folder names.
          detect_type() {
            local puml="$1"
            local CONTENT
            CONTENT=$(sed -n '1,200p' "$puml" | tr '[:upper:]' '[:lower:]')

            if   grep -q '@startgantt'   <<< "$CONTENT"; then echo "Gantt"
            elif grep -q '@startmindmap' <<< "$CONTENT"; then echo "MindMap"
            elif grep -Eq '\b(participant|activate|deactivate)\b|->|<-|-->|<--' <<< "$CONTENT"; then echo "Sequence"
            elif grep -Eq '\b(start|stop|partition|fork|merge|repeat|while|endif|endwhile)\b' <<< "$CONTENT"; then echo "Activity"
            elif grep -Eq '\b(class|interface|abstract|enum)\b' <<< "$CONTENT"; then echo "Class"
            elif grep -Eq '\b(actor|usecase)\b|\(.*\)' <<< "$CONTENT"; then echo "UseCase"
            elif grep -Eq '\b(state)\b|\[\*\]' <<< "$CONTENT"; then echo "State"
            elif grep -Eq '\b(component|node|cloud|database|artifact)\b' <<< "$CONTENT"; then echo "Component"
            elif grep -Eq '\bobject\b' <<< "$CONTENT"; then echo "Object"
            elif grep -Eq '\b(concise|robust|clock)\b' <<< "$CONTENT"; then echo "Timing"
            else echo "Other"
            fi
          }

          # ── Output directory ─────────────────────────────────────────────────────────
          # Maps: docs/UML/Source/<subdir>/<file>.puml
          #    → docs/UML/<Type>/<subdir>/
          #
          # Rule: strip the Source prefix, keep the subdirectory path exactly as-is,
          # place under the detected type folder. Never append the filename as a folder.
          compute_outdir() {
            local puml="$1"
            local type="$2"

            # Strip the leading source path to get the relative subdirectory
            local rel="${puml#docs/UML/Source/}"   # e.g. core/foo.puml
            local subdir
            subdir=$(dirname "$rel")               # e.g. core  (or "." if at root)

            if [[ "$subdir" == "." ]]; then
              echo "docs/UML/$type"
            else
              echo "docs/UML/$type/$subdir"
            fi
          }

          # ── Process a single file ────────────────────────────────────────────────────
          process_file() {
            local puml="$1"
            local mode="$2"   # "dry" or "render"

            if ! grep -qi '@startuml' "$puml"; then
              echo "SKIP (no @startuml): $puml"
              return
            fi

            local TYPE OUT_DIR TEMP_DIR
            TYPE=$(detect_type "$puml")
            OUT_DIR=$(compute_outdir "$puml" "$TYPE")

            if [[ "$mode" == "dry" ]]; then
              echo "Source: $puml  ->  $OUT_DIR  [type: $TYPE]"
              return
            fi

            # Render mode: use a temp dir then move SVGs to avoid PlantUML
            # resolving -o relative to the source file location.
            mkdir -p "$OUT_DIR"
            TEMP_DIR=$(mktemp -d)

            echo "Rendering: $puml  ->  $OUT_DIR  [type: $TYPE]"
            java -jar .plantuml/plantuml.jar -tsvg "$puml" -o "$TEMP_DIR"

            if compgen -G "$TEMP_DIR/*.svg" > /dev/null; then
              mv "$TEMP_DIR"/*.svg "$OUT_DIR/"
              echo "  OK: SVGs moved to $OUT_DIR"
            else
              echo "  WARNING: No SVGs produced for $puml"
            fi

            rm -rf "$TEMP_DIR"
          }

          # ── Entry point ──────────────────────────────────────────────────────────────
          process_file "$1" "$2"
          SCRIPT
          chmod +x map_and_render.sh

      - name: Dry-run mapping
        run: |
          echo "=== Planned output mapping ==="
          while IFS= read -r puml; do
            bash map_and_render.sh "$puml" dry
          done < <(find docs/UML/Source -name "*.puml" | sort)

      - name: Render diagrams
        run: |
          while IFS= read -r puml; do
            bash map_and_render.sh "$puml" render
          done < <(find docs/UML/Source -name "*.puml" | sort)

      - name: Debug - list generated files
        run: |
          echo "=== Generated SVGs ==="
          find docs/UML -name "*.svg" | sort || echo "No SVGs found"
          echo "=== Git status ==="
          git status

      - name: Commit generated diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/UML || true
          git diff --staged --quiet || git commit -m "ci: auto-generate UML diagrams [skip ci]"
          git push