name: Generate PlantUML Diagrams

on:
  push:
    branches: [main]
    paths:
      - 'docs/UML/Source/**/*.puml'
  workflow_dispatch:

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Download PlantUML JAR
        run: |
          curl -L --fail --retry 3 -o plantuml.jar \
            https://github.com/plantuml/plantuml/releases/download/v1.2026.3/plantuml-gplv2-1.2026.3.jar
          
          java -jar plantuml.jar -version

      - name: Generate SVGs with auto-routing
        run: |
          while IFS= read -r puml; do
            if grep -qiE '^[[:space:]]*@(startuml|startgantt|startmindmap)' "$puml"; then
              if grep -qiE '^[[:space:]]*@startgantt' "$puml"; then
                TYPE="Gantt"
              elif grep -qiE '^[[:space:]]*@startmindmap' "$puml"; then
                TYPE="MindMap"
              elif grep -qiE '^[[:space:]]*(class|abstract|interface|enum)[[:space:]]+' "$puml"; then
                TYPE="Class"
              elif grep -qiE '^[[:space:]]*.+[[:space:]]*(-+>|<-+|-->|<--)' "$puml"; then
                TYPE="Sequence"
              elif grep -qiE '^[[:space:]]*(actor|usecase|\(.*\))' "$puml"; then
                TYPE="UseCase"
              elif grep -qiE '^[[:space:]]*(state[[:space:]]+|\[\*\])' "$puml"; then
                TYPE="State"
              elif grep -qiE '^[[:space:]]*(component|node|cloud|database)[[:space:]]+' "$puml"; then
                TYPE="Component"
              elif grep -qiE '^[[:space:]]*object[[:space:]]+' "$puml"; then
                TYPE="Object"
              elif grep -qiE '^[[:space:]]*(concise|robust|clock)[[:space:]]+' "$puml"; then
                TYPE="Timing"
              else
                TYPE="Other"
              fi
            else
              echo "Skipping $puml — no recognized PlantUML start directive found"
              continue
            fi

            REL_PATH="${puml#docs/UML/Source/}"
            SUB_DIR=$(dirname "$REL_PATH")

            # Extract Python filename (without extension)
            PY_FILE=$(basename "$REL_PATH" .puml)

            # Correct output directory:
            # docs/UML/<TYPE>/<SUB_DIR>/<PY_FILE>
            OUT_DIR="docs/UML/$TYPE/$SUB_DIR/$PY_FILE"
            mkdir -p "$OUT_DIR"

            TEMP_DIR=$(mktemp -d)
            echo "Processing: $puml -> $OUT_DIR [$TYPE]"
            java -jar plantuml.jar -tsvg "$puml" -o "$TEMP_DIR"
            mv "$TEMP_DIR"/*.svg "$OUT_DIR/" 2>/dev/null && \
              echo "  Moved to $OUT_DIR" || \
              echo "  WARNING: No SVGs generated for $puml"
            rm -rf "$TEMP_DIR"

          done < <(find docs/UML/Source -name "*.puml")

      - name: Debug - list generated files
        run: |
          echo "=== Generated output ==="
          find docs/UML -name "*.svg" | sort || echo "No SVGs found"
          echo "=== Source files ==="
          find docs/UML/Source -name "*.puml" | sort

      - name: Commit generated diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== Git status before add ==="
          git status

          echo "=== Adding all UML output ==="
          git add docs/UML || true

          echo "=== Git status after add ==="
          git status

          echo "=== Staged files ==="
          git diff --staged --name-only

          git diff --staged --quiet || git commit -m "ci: auto-generate UML diagrams [skip ci]"
          git push